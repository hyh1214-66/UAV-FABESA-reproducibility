# =============================================================
# UAV-FABESA 仿真平台配置文件
# config.yaml
# =============================================================
# 修改此文件切换场景，不需要改任何Python代码
# 所有参数均有注释说明，单位在参数名中体现
# =============================================================

# -------------------------------------------------------------
# 仿真基础设置
# -------------------------------------------------------------
simulation:
  run_id: "scenario_default"        # 运行ID，影响输出目录名
  total_ticks: 40                   # 仿真总步数
  tick_duration_s: 1.0              # 每tick代表的真实时间（秒）
  random_seed: 42                   # 全局随机种子（保证复现性）
  warmup_ticks: 5                   # 预热tick数（不计入统计）
  verbose: false                    # 是否打印详细日志
  save_snapshot_interval: 10        # 每N tick保存拓扑快照（用于图5）

# -------------------------------------------------------------
# UAV 集群设置
# -------------------------------------------------------------
swarm:
  n_nodes: 30                       # UAV总数（不含GCS）
  map_width_m: 600.0                # 仿真地图宽度（米）
  map_height_m: 600.0               # 仿真地图高度（米）

  # 角色比例（必须加起来约等于1.0）
  role_distribution:
    COMMANDER: 0.10                 # 指挥机：10%
    SCOUT:     0.50                 # 侦察机：50%
    STRIKE:    0.30                 # 打击机：30%
    CARRIER:   0.10                 # 运输机：10%

  # 初始电量范围（百分比）
  battery_init_min: 60.0
  battery_init_max: 100.0

# -------------------------------------------------------------
# GCS（地面控制站）设置
# -------------------------------------------------------------
gcs:
  gcs_id: "GCS"
  position_x_m: 0.0                 # GCS固定坐标X
  position_y_m: 0.0                 # GCS固定坐标Y
  timeout_ticks: 5                  # UAV超时失联判定tick数
  schedule_interval: 5              # 任务调度间隔（每N tick）

# -------------------------------------------------------------
# 移动模型设置
# -------------------------------------------------------------
mobility:
  max_speed_mps: 15.0               # 最大飞行速度（m/s）
  min_speed_mps: 5.0                # 最小飞行速度（m/s）
  turn_rate_rad: 0.3                # 最大转向速率（rad/tick）
  heading_noise: 0.1                # 随机游走航向扰动（rad）

# -------------------------------------------------------------
# 无线信道设置
# -------------------------------------------------------------
channel:
  tx_power_dbm: 20.0                # 发射功率（dBm）
  frequency_ghz: 2.4                # 载波频率（GHz）
  path_loss_exponent: 2.2           # 路径损耗指数（自由空间=2）
  ref_distance_m: 1.0               # 参考距离（米）
  noise_power_dbm: -90.0            # 噪声功率（dBm）
  shadowing_std_db: 2.0             # 阴影衰落标准差（dB，0=关闭）
  max_range_m: 400.0                # 最大通信距离（米）
  min_rssi_dbm: -85.0               # 最低接收灵敏度（dBm）
  max_plr: 0.8                      # 最大可用丢包率阈值
  processing_delay_ms: 1.0          # 处理时延（ms）

# -------------------------------------------------------------
# 拓扑设置
# -------------------------------------------------------------
topology:
  type: "Mesh"                      # Star / Cluster / Mesh
  update_every_tick: true           # 是否每tick重算拓扑

# -------------------------------------------------------------
# 任务流设置
# -------------------------------------------------------------
traffic:
  msgs_per_tick: 3                  # 每tick每节点平均发消息数
  # 各消息类型比例（必须加起来约等于1.0）
  msg_type_distribution:
    RECON:  0.30
    CMD:    0.20
    SYNC:   0.20
    COORD:  0.15
    STATUS: 0.15

# -------------------------------------------------------------
# ABE 设置
# -------------------------------------------------------------
abe:
  scheme: "CP"                      # CP / KP
  enable_opt1_hash_cache: true      # OPT-1：哈希缓存
  enable_opt2_precompute: true      # OPT-2：公钥预计算
  enable_opt3_gt_grouping: true     # OPT-3：GT分组运算
  enable_policy_optimizer: true     # OPT-4：策略复杂度优化
  n_encrypt_per_msg: 1              # 每条消息加密次数

# -------------------------------------------------------------
# 输出设置
# -------------------------------------------------------------
output:
  results_dir: "UAV_Results"        # 数据输出根目录
  figures_dir: "UAV_Figures"        # 图表输出根目录
  logger_flush_interval: 50        # 日志flush间隔（tick）
  export_node_snapshots: true       # 是否导出节点快照（数据量大）
  export_link_records: true         # 是否导出链路记录