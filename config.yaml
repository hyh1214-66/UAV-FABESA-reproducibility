# =============================================================
# UAV-FABESA Simulation Platform Configuration File
# config.yaml
# =============================================================
# Modify this file to switch scenarios; no Python code changes required
# All parameters are documented with comments; units are reflected in parameter names
# =============================================================

# -------------------------------------------------------------
# Simulation Basic Settings
# -------------------------------------------------------------
simulation:
  run_id: "scenario_default"        # Run ID; affects output directory name
  total_ticks: 50                   # Total simulation steps
  tick_duration_s: 1.0              # Real time per tick (seconds)
  random_seed: 42                   # lobal random seed (for reproducibility)
  warmup_ticks: 5                   # Warm-up ticks (excluded from statistics)
  verbose: false                    # hether to print detailed logs
  save_snapshot_interval: 10        # Save topology snapshot every N ticks (for Fig. 5)

# -------------------------------------------------------------
# AV Swarm Settings
# -------------------------------------------------------------
swarm:
  n_nodes: 30                       # Total number of UAVs (excluding GCS)
  map_width_m: 600.0                # mulation map width (meters)
  map_height_m: 600.0               # 仿Simulation map height (meters)

  # Role distribution (must sum to approximately 1.0)
  role_distribution:
    COMMANDER: 0.10                 # Commander: 10%
    SCOUT:     0.50                 # Scout: 50%
    STRIKE:    0.30                 # Strike: 30%
    CARRIER:   0.10                 # Carrier: 10%

  # nitial battery range (percentage)
  battery_init_min: 60.0
  battery_init_max: 100.0

# -------------------------------------------------------------
# CS (Ground Control Station) Settings
# -------------------------------------------------------------
gcs:
  gcs_id: "GCS"
  position_x_m: 0.0                 # GCS fixed coordinate X
  position_y_m: 0.0                 # GCS fixed coordinate Y
  timeout_ticks: 5                  # Ticks to determine UAV timeout/loss of contact
  schedule_interval: 5              # ask scheduling interval (every N ticks)

# -------------------------------------------------------------
# Mobility Model Settings
# -------------------------------------------------------------
mobility:
  max_speed_mps: 15.0               # Maximum flight speed (m/s)
  min_speed_mps: 5.0                # Minimum flight speed (m/s)
  turn_rate_rad: 0.3                # aximum turn rate (rad/tick)
  heading_noise: 0.1                #  Random walk heading perturbation (rad)

# -------------------------------------------------------------
# Wireless Channel Settings
# -------------------------------------------------------------
channel:
  tx_power_dbm: 20.0                # Transmit power (dBm)
  frequency_ghz: 2.4                # Carrier frequency (GHz)
  path_loss_exponent: 2.2           # Path loss exponent (free space = 2)
  ref_distance_m: 1.0               # Reference distance (meters)
  noise_power_dbm: -90.0            # Noise power (dBm)
  shadowing_std_db: 2.0             # Shadowing standard deviation (dB; 0 = off)
  max_range_m: 400.0                #  Maximum communication range (meters)
  min_rssi_dbm: -85.0               # Minimum receiver sensitivity (dBm)
  max_plr: 0.8                      # aximum acceptable packet loss rate threshold
  processing_delay_ms: 1.0          #  Processing delay (ms)


# -------------------------------------------------------------
# Topology Settings
# -------------------------------------------------------------
topology:
  type: "Mesh"                      # Star / Cluster / Mesh
  update_every_tick: true           # Whether to recompute topology every tick

# -------------------------------------------------------------
# Traffic Flow Settings
# -------------------------------------------------------------
traffic:
  msgs_per_tick: 3                  # Average number of messages sent per node per tick
  
  msg_type_distribution:            # Message type distribution (must sum to approximately 1.0)
    RECON:  0.30
    CMD:    0.20
    SYNC:   0.20
    COORD:  0.15
    STATUS: 0.15

# -------------------------------------------------------------
# ABE Settings
# -------------------------------------------------------------
abe:
  scheme: "CP"                      # CP / KP
  enable_opt1_hash_cache: true      # OPT-1：Hash cache
  enable_opt2_precompute: true      # OPT-2：ublic key precomputation
  enable_opt3_gt_grouping: true     # OPT-3：GT group operations
  enable_policy_optimizer: true     # OPT-4：Policy complexity optimization
  n_encrypt_per_msg: 1              # Number of encryptions per message

# -------------------------------------------------------------
# Output Settings
# -------------------------------------------------------------
output:
  results_dir: "UAV_Results"        # Data output root directory
  figures_dir: "UAV_Figures"        # Figures output root directory
  logger_flush_interval: 50        # Log flush interval (ticks)
  export_node_snapshots: true       # Whether to export node snapshots (large data volume)
  export_link_records: true         # Whether to export link records
